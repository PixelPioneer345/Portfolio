<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testing Grounds</title>
    <style>
      .archdiv {
        display: flex;
        flex-direction: row;
      }

      .box1 {
        background-color: white;
        border: 3px solid grey;
        border-radius: 8px;
        padding: 20px 40px;
        margin: 0 20px;
      }

      .pictures {
        width: 100px;
        height: 100px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="archdiv">
      <div>
        <div class="box1">
          <img src="imgs and refs/JavaScript-logo.png" class="pictures" />
        </div>
        <p><center>javascript</center></p>
      </div>
      <div>
        <div class="box1">
          <img src="imgs and refs/React-icon.svg.png" class="pictures" />
        </div>
        <p><center>React</center></p>
      </div>
      <div>
        <div class="box1">
          <img src="imgs and refs/PHP-logo.svg.png" class="pictures" />
        </div>
        <p><center>PHP</center></p>
      </div>
      <div>
        <div class="box1">
          <img
            src="imgs and refs/Python-logo-notext.svg.png"
            class="pictures"
          />
        </div>
        <p><center>Python</center></p>
      </div>
    </div>
  </body>
</html>
